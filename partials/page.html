<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="{{ASSET}}/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{SITE_NAME}} · Fotokunst">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:locale" content="de_DE">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<style>{{THEME_VARS}}</style>
<link rel="stylesheet" href="{{ASSET}}/css/style.css">
<script src="{{ASSET}}/js/lightbox.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{BRAND_HREF}}">{{SITE_NAME}}<em> · Fotokunst</em></a>
    <nav class="site-nav" aria-label="Hauptnavigation">
      {{NAV}}
    </nav>
  </div>
</header>
<main class="wrap main-content">
  <section class="gallery-head">
    <p class="crumb">{{CRUMB}}</p>
    <h1>{{TITLE}}</h1>
    {{SUBTITLE_BLOCK}}
  </section>
  <section class="gallery" data-gallery="{{GALLERY_SLUG}}">
    {{LAYOUT}}
  </section>
</main>
<footer class="site-footer">
  <div class="wrap">
    <p>© <span id="year">2025</span> {{SITE_NAME}} · Fotokunst</p>
    <p class="footer-links"><a href="mailto:{{CONTACT_EMAIL}}">Kontakt</a> · <a href="{{INSTAGRAM_URL}}" rel="noopener">Instagram</a></p>
  </div>
</footer>
</body>
</html>
